

{% extends "admin/base.html" %}

{% block extrastyle %}
{{ block.super }}

<style>

/* SMART MENTOR THEME */

body {
    background: #f4f6fc !important;
    font-family: "Segoe UI", Arial, sans-serif !important;
}

/* HEADER */

#header {
    background: linear-gradient(120deg, #312e81, #4f46e5, #9333ea) !important;
    padding: 18px 25px !important;
}

#site-name a {
    color: white !important;
    font-size: 24px !important;
    font-weight: bold !important;
}

/* DASHBOARD BANNER */

#content-main {
    position: relative;
}

#content-main::before {
    content: "WELCOME TO SMART MENTOR! 🎓\A Student Academic Performance Management System\A Manage students, teachers, timetables and notifications.";

    display: block;
    white-space: pre-line;
    box-sizing: border-box;

    padding: 35px 230px 35px 30px;
    min-height: 190px;
    margin-bottom: 30px;

    border-radius: 16px;
    color: white;

    font-size: 17px;
    line-height: 2;

    background:
        linear-gradient(110deg,
            rgba(49,46,129,.96),
            rgba(79,70,229,.83),
            rgba(124,58,237,.65)),
        url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1000");

    background-size: cover;
    background-position: center;

    box-shadow: 0 8px 25px rgba(79,70,229,.2);
}

/* MOVING STUDENT PHOTO */

#content-main::after {
    content: "";
    position: absolute;

    width: 125px;
    height: 125px;

    right: 45px;
    top: 25px;

    border: 5px solid white;
    border-radius: 50%;

    background-image:
        url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=300");

    background-size: cover;
    background-position: center;

    animation: studentMove 3s ease-in-out infinite;

    box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

@keyframes studentMove {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-18px) rotate(6deg);
    }
}

/* ADMIN MODULES */

.module {
    border: none !important;
    border-radius: 12px !important;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0,0,0,.07);
    margin-bottom: 25px !important;
    transition: .3s ease;
}

.module:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(79,70,229,.15);
}

.module caption,
.module h2 {
    background: linear-gradient(90deg,#4f46e5,#9333ea) !important;
    color: white !important;
    padding: 14px !important;
}

.button,
input[type="submit"] {
    background: #4f46e5 !important;
    color: white !important;
    border-radius: 7px !important;
}

/* MOBILE */

@media(max-width:700px) {
    #content-main::before {
        padding: 25px;
        font-size: 14px;
    }

    #content-main::after {
        display: none;
    }
}

</style>
{% endblock %}
