{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}

<style>

/* ==========================================
   SMART MENTOR ADMIN DASHBOARD
========================================== */

:root{
    --primary:#4f46e5;
    --secondary:#7c3aed;
    --dark:#312e81;
    --light:#f4f6ff;
    --white:#ffffff;
    --text:#26304a;
}

html,

/* ==========================================
   ANIMATED BACKGROUND IMAGES
========================================== */

body {
    position: relative;
    isolation: isolate;
    background: transparent !important;
    overflow-x: hidden;
}

/* First image */
body::before {
    content: "";
    position: fixed;
    inset: -5%;
    z-index: -1;
    pointer-events: none;

    background:
        linear-gradient(
            rgba(10, 15, 35, 0.40),
            rgba(10, 15, 35, 0.40)
        ),
        url("{% static 'mentor/images/brooke-cagle-g1kr4ozfoac-unsplash.jpg' %}");

    background-size: cover;
    background-position: center;

    animation: fadeFirst 5s infinite,
               moveFirst 7s ease-in-out infinite alternate;
}

/* Second image */
body::after {
    content: "";
    position: fixed;
    inset: -5%;
    z-index: -1;
    pointer-events: none;

    background:
        linear-gradient(
            rgba(10, 15, 35, 0.40),
            rgba(10, 15, 35, 0.40)
        ),
        url("{% static 'mentor/images/faysal-ahmed-QiRkqLaZuZU-unsplash.jpg' %}");

    background-size: cover;
    background-position: center;

    animation: fadeSecond 16s infinite,
               moveSecond 20s ease-in-out infinite alternate;
}


/* ==========================================
   MAIN CONTAINERS
========================================== */

#container,
#content,
#content-main,
#content-related{
    background:transparent !important;
}

#content{
    position:relative;
    z-index:2;
    padding:25px !important;
}

/* ==========================================
   HEADER
========================================== */

#header{
    background:linear-gradient(
        135deg,
        #312e81,
        #4f46e5,
        #7c3aed
    ) !important;

    padding:18px 25px !important;

    box-shadow:0 6px 25px rgba(49,46,129,.30);
}

#site-name a{
    color:#fff !important;
    font-size:24px !important;
    font-weight:700 !important;
}

#user-tools{
    color:#fff !important;
}

#user-tools a{
    color:#fff !important;
}

/* ==========================================
   BREADCRUMBS
========================================== */

div.breadcrumbs{
    background:rgba(255,255,255,.70) !important;
    backdrop-filter:blur(8px);

    color:#312e81 !important;

    padding:12px 25px !important;
}

div.breadcrumbs a{
    color:#4f46e5 !important;
    font-weight:600;
}

/* ==========================================
   PAGE TITLE
========================================== */


/* Animated Gradient Heading */


#content h1 {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 1px;

    background: linear-gradient(
        110deg,
        #806000 0%,
        #c49a28 20%,
        #fff1a8 35%,
        #d4af37 50%,
        #fff8dc 60%,
        #9c7415 80%,
        #d4af37 100%
    );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: goldShine 19s linear infinite;

    filter: drop-shadow(0px 2px 3px rgba(212,175,55,0.35));
}

/* Realistic Metallic Shine */

@keyframes goldShine {
    0% {
        background-position: 200% center;
    }

    100% {
        background-position: -200% center;
    }
}

/* ==========================================
   MODULE CARDS
========================================== */

.dashboard .module,
#content-main .module{

    background:rgba(255,255,255,.92) !important;

    backdrop-filter:blur(10px);

    border-radius:16px !important;

    border:1px solid rgba(255,255,255,.70) !important;

    overflow:hidden;

    margin-bottom:24px !important;

    box-shadow:
    0 10px 30px rgba(49,46,129,.10);

    transition:.30s ease;
}

.dashboard .module:hover,
#content-main .module:hover{

    transform:translateY(-4px);

    box-shadow:
    0 15px 35px rgba(79,70,229,.18);
}

/* ==========================================
   MODULE HEADERS
========================================== */

.module caption,
.module h2{

    background:linear-gradient(
        90deg,
        #312e81,
        #4f46e5
    ) !important;

    color:#fff !important;

    padding:14px 18px !important;

    font-size:15px !important;

    font-weight:700 !important;

    letter-spacing:.5px;
}

.module caption a{
    color:#fff !important;
    text-decoration:none !important;
}

.module caption a:hover{
    color:#fff !important;
}

/* ==========================================
   TABLE CONTENT
========================================== */

.dashboard .module th,
.dashboard .module td{
    font-size:14px !important;
    font-weight:600 !important;
    padding:12px !important;
}

/* ==========================================
   LINKS
========================================== */

.module a{
    color:#4f46e5 !important;
    text-decoration:none !important;
    font-weight:600 !important;
}

.module a:hover{
    color:#7c3aed !important;
}

/* ==========================================
   CHANGE LIST TABLE
========================================== */

#result_list{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
}

#result_list thead th{
    background:#eef0ff !important;
    color:#312e81 !important;
}

#result_list tbody tr:hover{
    background:#f3f2ff !important;
}

/* ==========================================
   BUTTONS
========================================== */

.button,
input[type=submit],
input[type=button],
.submit-row input{

    background:linear-gradient(
        135deg,
        #4f46e5,
        #7c3aed
    ) !important;

    border:none !important;

    color:#fff !important;

    border-radius:8px !important;

    padding:10px 18px !important;

    font-weight:600 !important;

    transition:.30s ease;
}

.button:hover,
input[type=submit]:hover,
input[type=button]:hover{

    transform:translateY(-2px);

    box-shadow:
    0 8px 20px rgba(79,70,229,.30);
}

/* ==========================================
   FORM FIELDS
========================================== */

input[type=text],
input[type=email],
input[type=password],
input[type=number],
input[type=url],
select,
textarea{

    border:1px solid #d8dcf0 !important;

    border-radius:8px !important;

    padding:10px !important;
}

input:focus,
textarea:focus,
select:focus{

    outline:none !important;

    border-color:#4f46e5 !important;

    box-shadow:
    0 0 0 3px rgba(79,70,229,.15);
}

/* ==========================================
   FILTER SIDEBAR
========================================== */

#changelist-filter{

    background:rgba(255,255,255,.95);

    border-radius:14px;

    padding:15px;

    box-shadow:
    0 6px 20px rgba(49,46,129,.08);
}

#changelist-filter h2{

    background:#312e81 !important;

    color:white !important;

    border-radius:8px;

    padding:10px;
}

/* ==========================================
   RECENT ACTIONS
========================================== */

#content-related .module{

    background:rgba(255,255,255,.95) !important;

    border-radius:16px !important;

    box-shadow:
    0 8px 25px rgba(49,46,129,.10);
}

#content-related h2{

    color:white !important;

    font-size:16px !important;

    font-weight:700 !important;
}

#content-related a{

    font-size:14px !important;

    font-weight:600 !important;
}

/* ==========================================
   ANIMATION
========================================== */

#content-main{
    animation:dashboardEntry .7s ease;
}

@keyframes dashboardEntry{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ==========================================
   SMOOTH SCROLL
========================================== */

html{
    scroll-behavior:smooth;
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width:768px){

    #header{
        padding:14px !important;
    }

    #content{
        padding:15px !important;
    }

    #site-name a{
        font-size:18px !important;
    }

    .dashboard .module,
    #content-main .module{
        border-radius:12px !important;
    }
}

</style>

{% endblock %}
